name: Daily AI News Generator

on:
  schedule:
    # 9:30 AM IST = 04:00 UTC
    - cron: '0 4 * * *'
    # 3:00 PM IST = 09:30 UTC
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run AI News Generator
      env:
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        rm -f daily_ai_script_*.md
        python main_ai.py
        echo "Script execution completed"
        ls -la

    - name: Prepare Email Body
      run: |
        # Check if file exists and rename it
        if ls daily_ai_script_*.md 1> /dev/null 2>&1; then
          mv daily_ai_script_*.md email_body.md
          echo "File renamed successfully"
        else
          echo "Error: No AI news script file found!"
          echo "Creating fallback email..."
          echo "# Error\n\nThe AI news script generation failed. Please check the workflow logs." > email_body.md
        fi

    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: Daily AI News Digest
        to: ${{ secrets.MAIL_TO }}
        from: Daily News Bot
        body: file://email_body.md
        secure: true
